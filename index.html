
<script>
"use strict";

/* =========================================================
   1. UTILIDADES Y VALIDACIONES GENERALES
   ========================================================= */

function parsear(str) {
    if (typeof str !== "string" || !str.trim()) return [];

    const partes = str.split(",").map(p => p.trim());

    if (partes.some(p => p === "")) return [];

    const numeros = partes.map(Number);

    return numeros.every(Number.isFinite) ? numeros : [];
}

function mostrarError(mensaje) {
    alert(mensaje);
}

function obtenerNumero(id) {
    const campo = document.getElementById(id);

    if (!campo || campo.value.trim() === "") return null;

    const numero = Number(campo.value);

    return Number.isFinite(numero) ? numero : null;
}

function formato(numero, decimales = 4) {
    if (!Number.isFinite(numero)) return "No definido";
    return numero.toFixed(decimales);
}

function calcularMedia(valores) {
    if (!Array.isArray(valores) || valores.length === 0) {
        return NaN;
    }

    return valores.reduce((suma, valor) => suma + valor, 0)
        / valores.length;
}

function calcularDesviacionMuestral(
    valores,
    media = calcularMedia(valores)
) {
    if (!Array.isArray(valores) || valores.length < 2) {
        return NaN;
    }

    if (!Number.isFinite(media)) return NaN;

    const sumaCuadrados = valores.reduce(
        (suma, valor) => suma + (valor - media) ** 2,
        0
    );

    return Math.sqrt(sumaCuadrados / (valores.length - 1));
}

function obtenerFrecuencias(valores) {
    const frecuencias = new Map();

    valores.forEach(valor => {
        frecuencias.set(
            valor,
            (frecuencias.get(valor) || 0) + 1
        );
    });

    return frecuencias;
}

/* =========================================================
   2. DISTRIBUCIÓN NORMAL ESTÁNDAR
   ========================================================= */

function probabilidadNormalEstandar(z) {
    if (!Number.isFinite(z)) return NaN;

    // Aproximación numérica de la función de distribución normal.
    const signo = z < 0 ? -1 : 1;
    const x = Math.abs(z) / Math.sqrt(2);

    const t = 1 / (1 + 0.3275911 * x);

    const a1 = 0.254829592;
    const a2 = -0.284496736;
    const a3 = 1.421413741;
    const a4 = -1.453152027;
    const a5 = 1.061405429;

    const polinomio =
        (((((a5 * t + a4) * t) + a3) * t + a2) * t + a1);

    const erf = 1 - polinomio * t * Math.exp(-x * x);

    const probabilidad = 0.5 * (1 + signo * erf);

    return Math.max(0, Math.min(1, probabilidad));
}

/* =========================================================
   5. ESTADÍSTICA DESCRIPTIVA
   ========================================================= */

function calcularEstadisticaDescriptiva() {
    const campo = document.getElementById("inputEstadistica");
    if (!campo) return;

    const valores = parsear(campo.value);

    if (valores.length === 0) {
        mostrarError("Ingrese datos numéricos válidos separados por comas.");
        return;
    }

    const n = valores.length;
    const media = calcularMedia(valores);
    const ordenados = [...valores].sort((a, b) => a - b);

    const mediana = n % 2 === 0
        ? (ordenados[n / 2 - 1] + ordenados[n / 2]) / 2
        : ordenados[Math.floor(n / 2)];

    const rango = ordenados[n - 1] - ordenados[0];
    const desv = calcularDesviacionMuestral(valores, media);
    const frecuencias = obtenerFrecuencias(valores);
    const maxFrecuencia = Math.max(...frecuencias.values());

    const modas = [...frecuencias.entries()]
        .filter(([valor, frecuencia]) =>
            frecuencia === maxFrecuencia && frecuencia > 1
        )
        .map(([valor]) => valor)
        .sort((a, b) => a - b);

    const textoModa = modas.length === 0
        ? "Sin moda"
        : modas.join(", ");

    document.getElementById("stMedia").textContent = formato(media);
    document.getElementById("stMediana").textContent = formato(mediana);
    document.getElementById("stModa").textContent = textoModa;
    document.getElementById("stRango").textContent = formato(rango);

    document.getElementById("stDesv").textContent =
        Number.isFinite(desv) ? formato(desv) : "No disponible (n < 2)";

    const interpretacion = document.getElementById("interpretacionEstadistica");

    if (interpretacion) {
        interpretacion.textContent =
            `Se analizaron ${n} mediciones. La media es ${formato(media)}; ` +
            `la mediana es ${formato(mediana)} y el rango es ${formato(rango)}. ` +
            (Number.isFinite(desv)
                ? `La desviación estándar muestral es ${formato(desv)}.`
                : "Se necesitan al menos dos mediciones para calcular la desviación muestral.");
    }
}

/* =========================================================

function procesarDatosExperimentales() {
    const campo = document.getElementById("inputDatosExp");
    if (!campo) return;

    const valores = parsear(campo.value);

    if (valores.length < 2) {
        mostrarError("Ingrese al menos dos mediciones numéricas válidas.");
        return;
    }

    const media = calcularMedia(valores);
    const desv = calcularDesviacionMuestral(valores, media);
    const errorEstandar = desv / Math.sqrt(valores.length);

    document.getElementById("expProm").textContent = formato(media);
    document.getElementById("expDesv").textContent = formato(desv);
    document.getElementById("expInc").textContent = formato(errorEstandar);

    document.getElementById("expReporte").textContent =
        `${formato(media, 3)} ± ${formato(errorEstandar, 3)}`;
}

/* =========================================================
   7. PUNTAJE Z DEL PANEL INFERIOR
   ========================================================= */

function calcularDashZ() {
    const x = obtenerNumero("dashX");
    const mu = obtenerNumero("dashMu");
    const sigma = obtenerNumero("dashSigma");

    if (x === null || mu === null || sigma === null) {
        mostrarError("Complete todos los campos con números válidos.");
        return;
    }

    if (sigma <= 0) {
        mostrarError("La desviación estándar debe ser mayor que cero.");
        return;
    }

    const z = (x - mu) / sigma;

    document.getElementById("valDashZ").textContent = formato(z);
}

/* =========================================================
   8. GRÁFICAS Y TABLAS DE FRECUENCIAS

let miGrafica = null;

function calcularIntervalos(valores) {
    const minimo = Math.min(...valores);
    const maximo = Math.max(...valores);

    if (minimo === maximo) {
        return [{
            inferior: minimo - 0.5,
            superior: maximo + 0.5,
            frecuencia: valores.length
        }];
    }

    // Regla de Sturges para estimar la cantidad de clases.
    const cantidadClases = Math.max(
        1,
        Math.ceil(1 + 3.322 * Math.log10(valores.length))
    );

    const amplitud = (maximo - minimo) / cantidadClases;

    const intervalos = Array.from({length: cantidadClases}, (_, i) => ({
        inferior: minimo + i * amplitud,
        superior: i === cantidadClases - 1
            ? maximo
            : minimo + (i + 1) * amplitud,
        frecuencia: 0
    }));

    valores.forEach(valor => {
        let indice = Math.floor((valor - minimo) / amplitud);
        indice = Math.max(0, Math.min(indice, cantidadClases - 1));
        intervalos[indice].frecuencia++;
    });

    return intervalos;
}

function calcularProbabilidadZ() {
    const x = obtenerNumero("probX");
    const mu = obtenerNumero("probMu");
    const sigma = obtenerNumero("probSigma");

    if (x === null || mu === null || sigma === null) {
        mostrarError("Complete todos los campos con números válidos.");
        return;
    }

    if (sigma <= 0) {
        mostrarError("La desviación estándar debe ser mayor que cero.");
        return;
    }

    const z = (x - mu) / sigma;
    const probabilidad = probabilidadNormalEstandar(z);

    document.getElementById("valZ").textContent = formato(z);
    document.getElementById("valProbAcum").textContent =
        formato(probabilidad);

    const porcentaje = document.getElementById("valPorcentaje");

    if (porcentaje) {
        porcentaje.textContent = `${(probabilidad * 100).toFixed(2)}%`;
    }
}

/* =========================================================
   10. CORRELACIÓN DE PEARSON Y REGRESIÓN LINEAL
   ========================================================= */

function calcularRelacionVariables() {
    const campoX = document.getElementById("datosX");
    const campoY = document.getElementById("datosY");
    const salida = document.getElementById("resultadoVariables");

    if (!campoX || !campoY || !salida) return;

    const x = parsear(campoX.value);
    const y = parsear(campoY.value);

    if (
        x.length < 2 ||
        y.length < 2 ||
        x.length !== y.length
    ) {
        salida.textContent =
            "Ingrese al menos dos pares de datos válidos. " +
            "X e Y deben tener la misma cantidad de valores.";
        return;
    }

    const n = x.length;
    const mx = calcularMedia(x);
    const my = calcularMedia(y);

    const sxx = x.reduce((s, v) => s + (v - mx) ** 2, 0);
    const syy = y.reduce((s, v) => s + (v - my) ** 2, 0);

    const sxy = x.reduce(
        (s, v, i) => s + (v - mx) * (y[i] - my),
        0
    );

    if (sxx === 0 || syy === 0) {
        salida.textContent =
            "No se puede calcular la correlación porque X e Y " +
            "deben presentar variación.";
        return;
    }

    const rCalculado = sxy / Math.sqrt(sxx * syy);
    const r = Math.max(-1, Math.min(1, rCalculado));

    const pendiente = sxy / sxx;
    const intercepto = my - pendiente * mx;
    const r2 = r * r;

    const fuerza = Math.abs(r) >= 0.8
        ? "fuerte"
        : Math.abs(r) >= 0.5
            ? "moderada"
            : "débil";

    const direccion = r > 0
        ? "positiva"
        : r < 0
            ? "negativa"
            : "nula";

    const signo = pendiente < 0 ? "−" : "+";

    salida.innerHTML = `
        <p><strong>Número de pares:</strong> ${n}</p>
        <p><strong>Media de X:</strong> ${formato(mx)}</p>
        <p><strong>Media de Y:</strong> ${formato(my)}</p>
        <p><strong>Coeficiente de Pearson (r):</strong> ${formato(r)}</p>
        <p><strong>Coeficiente de determinación (R²):</strong> ${formato(r2)}</p>
        <p><strong>Pendiente (b):</strong> ${formato(pendiente)}</p>
        <p><strong>Intercepto (a):</strong> ${formato(intercepto)}</p>
        <p><strong>Regresión lineal:</strong>
            ŷ = ${formato(intercepto)} ${signo} ${formato(Math.abs(pendiente))}x
        </p>
        <p><strong>Interpretación:</strong>
            La relación lineal observada es ${fuerza} y ${direccion}.
        </p>
        <p><strong>Procedimiento:</strong>
            Se calcularon las medias, Sxx, Syy y Sxy.
            Después se obtuvo b = Sxy/Sxx, a = media(Y) − b·media(X)
            y r = Sxy/√(Sxx·Syy).
        </p>
        <p class="text-purple-300">
            La correlación describe asociación lineal; no demuestra causalidad.
            La fuerza se clasifica mediante criterios orientativos.
        </p>
    `;
}

function cargarEj(idx) {
    if (!Number.isInteger(idx) || idx < 0 || idx >= ejercicios.length) {
        return;
    }

    ejercicioActualIdx = idx;

    const ej = ejercicios[idx];

    const titulo = document.getElementById("ejTitulo");
    const enunciado = document.getElementById("ejEnunciado");
    const formula = document.getElementById("ejFormula");
    const respuesta = document.getElementById("ejRespUser");
    const feedback = document.getElementById("ejFeedback");

    if (!titulo || !enunciado || !formula || !respuesta || !feedback) {
        return;
    }

    titulo.textContent = `Ejercicio ${idx + 1}: ${ej.titulo}`;
    enunciado.textContent = ej.enunciado;
    formula.textContent = ej.formula;
    respuesta.value = "";
    respuesta.placeholder = `Respuesta en ${ej.unidad}`;
    feedback.textContent = "";
    feedback.className = "font-bold";
}

function verificarEj() {
    const campo = document.getElementById("ejRespUser");
    const feedback = document.getElementById("ejFeedback");

    if (!campo || !feedback) return;

    if (campo.value.trim() === "") {
        feedback.textContent = "Ingrese una respuesta numérica.";
        feedback.className = "text-yellow-400 font-bold";
        return;
    }

    const valor = Number(campo.value);
    const ej = ejercicios[ejercicioActualIdx];

    if (!Number.isFinite(valor)) {
        feedback.textContent = "Ingrese un número válido.";
        feedback.className = "text-yellow-400 font-bold";
        return;
    }

    const tolerancia = Math.max(
        1e-12,
        Math.abs(ej.respuesta) * ej.toleranciaRelativa
    );

    if (Math.abs(valor - ej.respuesta) <= tolerancia) {
        feedback.textContent =
            `¡Correcto! Resultado esperado: ${formato(ej.respuesta, 6)} ${ej.unidad}.`;

        feedback.className = "text-green-400 font-bold";
    } else {
        feedback.textContent =
            `Respuesta incorrecta. Revisa la fórmula, las unidades y la sustitución de datos.`;

        feedback.className = "text-red-400 font-bold";
    }
}

function activarDictadoVoz() {
    const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        mostrarError(
            "El dictado por voz no está disponible en este navegador. " +
            "Prueba un navegador compatible con reconocimiento de voz."
        );
        return;
    }

    const campo = prompt(
        "Indica el ID del campo donde deseas insertar el dictado:",
        "inputEstadistica"
    );

    if (!campo) return;

    const destino = document.getElementById(campo);

    if (!destino || !("value" in destino)) {
        mostrarError("No se encontró un campo de texto válido con ese ID.");
        return;
    }

    const reconocimiento = new SpeechRecognition();

    reconocimiento.lang = "es-GT";
    reconocimiento.interimResults = false;
    reconocimiento.continuous = false;

    reconocimiento.onresult = function(evento) {
        const texto = evento.results[0][0].transcript;

        if (destino.value.trim()) {
            destino.value += ", " + texto;
        } else {
            destino.value = texto;
        }
    };

    reconocimiento.onerror = function() {
        mostrarError(
            "No se pudo completar el dictado. Revisa los permisos del micrófono."
        );
    };

    reconocimiento.start();
}

function procesarFoto(evento) {
    const archivo = evento?.target?.files?.[0];

    if (!archivo) return;

    if (!archivo.type.startsWith("image/")) {
        mostrarError("Selecciona un archivo de imagen válido.");
        evento.target.value = "";
        return;
    }

    mostrarError(
        "La imagen se seleccionó correctamente, pero este sitio todavía " +
        "no tiene implementado el reconocimiento automático del contenido de la foto."
    );
}
